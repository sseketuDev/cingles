<script>
  /* Marca que hay JavaScript (para animaciones) y define el respaldo de fotos:
     si una imagen no existe, su contenedor .foto muestra un degradé con el nombre del archivo esperado. */
  document.documentElement.className += ' js';
  function sinFoto(img) {
    img.onerror = null;
    var marco = img.closest('.foto') || img.parentNode;
    marco.classList.add('sin-foto');
    marco.setAttribute('data-nombre', img.getAttribute('data-nombre') || img.getAttribute('src'));
  }
</script>
